<html lang="ko">
<head>
<meta charset="utf-8">
<title>月 · 辛卯</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="사주달력">
<meta name="description" content="개인 달력">

<link rel="icon" href="./icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF6F0;--bg2:#F5EFE6;--card:#FFFFFF;--line:#E8DFD3;--line2:#F1E9DE;
  --ink:#2A241E;--ink2:#6B6157;--ink3:#9C9085;
  --gold:#B4825C;--goldd:#8E6236;--goldt:#F6EADA;--rose:#C0726E;
  --serif:"Iowan Old Style","AppleMyungjo","Nanum Myeongjo","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% -10%, #FFFDF9 0%, #FAF6F0 45%, #F5EFE6 100%);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.01em;
  height:100dvh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(14px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));
  transition:opacity .38s ease;
}
body.out{opacity:0}
.lock{width:100%;max-width:326px;margin:auto 0;text-align:center}
.seal{
  width:58px;height:58px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:linear-gradient(160deg,#FFFDF9,#F6EFE4);
  box-shadow:0 6px 18px rgba(180,130,92,.10), inset 0 0 0 5px rgba(255,255,255,.7);
  font-family:var(--serif);font-size:23px;color:var(--gold);letter-spacing:.02em;
}
.brand{font-family:var(--serif);font-size:11px;letter-spacing:.26em;color:var(--ink3);margin-bottom:18px}
.brand b{color:var(--gold);font-weight:400}
h1{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:.06em;margin:0 0 6px;color:var(--ink)}
.sub{font-size:11.5px;color:var(--ink3);margin:0 0 18px;line-height:1.6}
.dots{display:flex;gap:14px;justify-content:center;height:14px;margin-bottom:10px}
.dots i{
  width:10px;height:10px;border-radius:50%;border:1px solid var(--line);
  background:#FFF;transition:transform .16s ease,background .16s ease,border-color .16s ease;
}
.dots i.on{background:var(--gold);border-color:var(--gold);transform:scale(1.06)}
.err{
  min-height:16px;font-size:11px;line-height:16px;color:var(--rose);
  letter-spacing:.01em;margin-bottom:12px;opacity:0;transition:opacity .2s ease;
}
.err.on{opacity:1}
.err.wait{color:var(--ink3);opacity:1}
.lock.shake .dots{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
.lock.shake{border-color:var(--rose)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}
}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}
.key{
  -webkit-appearance:none;appearance:none;font-family:var(--serif);
  height:53px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(42,36,30,.035);transition:background .12s ease,transform .1s ease;
}
.key:active{background:var(--bg2);transform:scale(.97)}
.key.blank{background:transparent;border:none;box-shadow:none;pointer-events:none}
.key.del{font-size:17px;color:var(--ink3)}
.keep{
  display:inline-flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink2);
  margin:0 auto 14px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.keep input{position:absolute;opacity:0;width:0;height:0}
.keep .box{
  width:17px;height:17px;border-radius:5px;border:1px solid var(--line);background:#FFF;
  display:flex;align-items:center;justify-content:center;transition:background .15s ease,border-color .15s ease;
}
.keep input:checked + .box{background:var(--gold);border-color:var(--gold)}
.keep .box:after{
  content:"";width:8px;height:4.5px;border-left:1.6px solid #FFF;border-bottom:1.6px solid #FFF;
  transform:rotate(-45deg) translate(0,-1px);opacity:0;transition:opacity .12s ease;
}
.keep input:checked + .box:after{opacity:1}
.unlock{
  -webkit-appearance:none;appearance:none;width:100%;height:46px;border-radius:14px;border:none;
  background:linear-gradient(170deg,#BE8C62,#A0714A);color:#FFFDF8;
  font-family:var(--sans);font-size:13px;letter-spacing:.05em;
  box-shadow:0 8px 18px rgba(160,113,74,.20);transition:opacity .15s ease,transform .1s ease;
}
.unlock:active{transform:scale(.985)}
.unlock:disabled{background:#EFE7DB;color:#B5A896;box-shadow:none}
.foot{font-size:9.5px;color:var(--ink3);margin-top:14px;line-height:1.7;opacity:.85}
.foot em{font-style:normal;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="seal">月</div>
  <div class="brand">月 · <b>辛卯</b></div>
  <h1>잠긴 달력</h1>
  <p class="sub">비밀번호 4자리를 입력하세요</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="err" id="err"></div>
  <div class="pad" id="pad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key blank" tabindex="-1"></button>
    <button class="key" data-k="0">0</button>
    <button class="key del" data-k="del" aria-label="지우기">⌫</button>
  </div>
  <label class="keep"><input type="checkbox" id="keep" checked><span class="box"></span>이 기기에서 잠금 해제 유지</label>
  <button class="unlock" id="unlock" disabled>잠금 해제</button>
  <p class="foot">올바른 번호 없이는 내용을 볼 수 없습니다.<br>기억을 지우려면 주소 끝에 <em>#reset</em></p>
</div>

    var s = '', C = 0x8000;
    for (var i = 0; i < u.length; i += C) s += String.fromCharCode.apply(null, u.subarray(i, i + C));
    return btoa(s);
  }
  var subtle = (window.crypto && window.crypto.subtle) || null;
  var enc = new TextEncoder();

  function derive(pin){
    return subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return subtle.deriveKey(
        {name:'PBKDF2', salt:b64d(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'},
        km, {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function unlockWith(key){
    return subtle.decrypt({name:'AES-GCM', iv:b64d(BLOB.iv), tagLength:128}, key, b64d(BLOB.ct))
      .then(function(pt){ return new TextDecoder().decode(pt); });
  }
  function remember(key){
    try{
      return subtle.exportKey('raw', key).then(function(raw){
        localStorage.setItem(STORE, b64e(new Uint8Array(raw)));
      });
    }catch(e){ return Promise.resolve(); }
  }
  function forget(){ try{ localStorage.removeItem(STORE); }catch(e){} }
  function storedKey(){
    var s = null;
    try{ s = localStorage.getItem(STORE); }catch(e){ return Promise.resolve(null); }
    if (!s) return Promise.resolve(null);
    return subtle.importKey('raw', b64d(s), 'AES-GCM', true, ['decrypt']).catch(function(){ return null; });
  }
  function boot(html){
    document.body.classList.add('out');
    setTimeout(function(){
      var d = document.open('text/html', 'replace');
      d.write(html);
      d.close();
    }, 140);
  }
  function paint(){
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i < buf.length);
    btn.disabled = busy || buf.length !== PIN_LEN;
  }
  function say(msg, cls){
    errEl.textContent = msg || '';
    errEl.className = 'err' + (msg ? ' on' : '') + (cls ? ' ' + cls : '');
  }
  function shake(msg){
    say(msg);
    lockEl.classList.remove('shake');
    void lockEl.offsetWidth;
    lockEl.classList.add('shake');
    setTimeout(function(){ lockEl.classList.remove('shake'); }, 460);
    buf = ''; paint();
  }
  function setBusy(on, msg){
    busy = on;
    document.getElementById('pad').style.pointerEvents = on ? 'none' : '';
    document.getElementById('pad').style.opacity = on ? '.45' : '';
    say(on ? (msg || '여는 중…') : '', on ? 'wait' : '');
    paint();
  }

  function attempt(){
    if (busy) return;
    if (buf.length !== PIN_LEN) { say('4자리를 입력해 주세요.'); return; }
    var pin = buf;
    setBusy(true);
    derive(pin).then(function(key){
      return unlockWith(key).then(function(html){
        if (keepEl.checked) {
          return remember(key).then(function(){ boot(html); });
        }
        forget();
        boot(html);
        return null;
      });
    }).catch(function(){
      // wrong PIN (AES-GCM authentication failure)
      setBusy(false);
      shake('번호가 맞지 않아요.');
    });
  }

  document.getElementById('pad').addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('[data-k]') : null;
    if (!t || busy) return;
    var k = t.getAttribute('data-k');
    if (k === 'del') { buf = buf.slice(0, -1); say(''); }
    else if (buf.length < PIN_LEN) { buf += k; say(''); }
    paint();
    if (buf.length === PIN_LEN) setTimeout(attempt, 120);
  });
  btn.addEventListener('click', attempt);
  document.addEventListener('keydown', function(e){
    if (busy) return;
    if (/^[0-9]$/.test(e.key)) {
      if (buf.length < PIN_LEN) { buf += e.key; say(''); paint(); }
      if (buf.length === PIN_LEN) setTimeout(attempt, 120);
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      buf = buf.slice(0, -1); say(''); paint();
    } else if (e.key === 'Enter') {
      attempt();
    }
  });

  // ---- boot ----
  if (!subtle) {
    say('이 브라우저에서는 열 수 없습니다. https 주소로 열어 주세요.');
    setBusy(true, '보안 연결이 필요합니다.');
    return;
  }
  if (/reset/.test(location.hash)) forget();
  var auto = /lock/.test(location.hash) ? Promise.resolve(null) : storedKey();
  auto.then(function(key){
    if (!key) { paint(); return; }
    setBusy(true, '여는 중…');
    unlockWith(key).then(function(html){ boot(html); }).catch(function(){
      forget(); setBusy(false); paint();
    });
  });
  paint();
})();
</script>
</body>
</html>
